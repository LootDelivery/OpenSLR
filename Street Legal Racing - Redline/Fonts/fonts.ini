# OpenSLRR font configuration (UTF-8).
#
# Maps stock fonts (by stem, lowercase) to a TTF family file under
# Fonts/families/<family>.ttf plus an optional size scale in percent.
# Fonts without a mapping here keep the legacy SCX charset rendering
# (symbol fonts, part-condition glyphs).
#
# Simple tuning:
#   <stock font> = <family> [scale%]
#     simple20  = simple 105
#   A single UI-wide size knob:
#     ui_scale  = 100
#
# Cyrillic is rendered from the TTF outline; no stock atlas is involved.

ui_scale = 100

simple20  = simple   100
simple40  = simple   100
slii11    = slii17   100
slii17    = slii17   100
slii18    = slii17   100
slii24    = slii17   100
console5  = console  100
console10 = console  100
sl14      = sl       100
sl28      = sl       100

# Fonts with no mapping above (e.g. text loaded from unknown RIDs).
fallback  = UI-stock 100
